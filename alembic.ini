[alembic]
script_location = alembic
prepend_sys_path = src
# The database URL is taken from the UKMC_DATABASE_URL environment variable by
# alembic/env.py. This value is only a fallback for local SQLite use.
sqlalchemy.url = sqlite:///./data/ukmc.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
